version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nzlegal-ollama
    volumes:
      - ollama_data:/root/.ollama
      - ./data:/data:ro
    restart: always
    ports:
      - "11434:11434"
    networks:
      - nzlegal-network
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        limits:
          memory: 10G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nzlegal-api
    environment:
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_DB_PATH=/app/chroma_db
      - TENANT_DATA_PATH=/app/tenant_data
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me-in-production}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text:latest}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-4096}
      - LLM_NUM_PREDICT=${LLM_NUM_PREDICT:-1024}
      - UVICORN_WORKERS=1
    volumes:
      - ./data:/app/data:ro
      - /workspace/chroma_db_fresh:/app/chroma_db
      - ./tenant_data:/app/tenant_data
      - ./secure_data:/app/secure_data
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
    restart: always
    networks:
      - nzlegal-network
    deploy:
      resources:
        limits:
          memory: 4G

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nzlegal-web
    ports:
      - "80:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: always
    networks:
      - nzlegal-network
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  ollama_data:

networks:
  nzlegal-network:
    driver: bridge
