#cloud-config

# Vultr GPU Instance Cloud-Init for NZ Legal RAG Demo
# Paste this into the "Cloud-Init User-Data" field when creating the instance.

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - jq
  - rsync

runcmd:
  # --- Install Docker ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - |
    echo "deb [arch="$(dpkg --print-architecture)" signed-by=/etc/apt/keyrings/docker.gpg] \
    https://download.docker.com/linux/ubuntu "$(. /etc/os-release && echo "$VERSION_CODENAME")" stable" \
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # --- Install NVIDIA Container Toolkit ---
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - |
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
    sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
    tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker

  # --- Create app directory ---
  - mkdir -p /opt/nzlegal

  # --- Install Ollama CLI (for pre-pulling models) ---
  - curl -fsSL https://ollama.com/install.sh | sh

  # --- Pull required models (Ollama service will use the same /root/.ollama volume) ---
  # These will be cached in /usr/share/ollama/.ollama by default, then copied/mounted into Docker.
  # We also configure Docker to use the GPU runtime so Ollama container can see the GPU.
  - ollama pull all-minilm:latest || true
  - ollama pull llama3.2:3b || true

  # --- Create a systemd service that starts the app once deployed ---
  - |
    cat > /etc/systemd/system/nzlegal.service << 'EOF'
    [Unit]
    Description=NZ Legal RAG Demo
    After=docker.service
    Requires=docker.service

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    WorkingDirectory=/opt/nzlegal
    Environment="COMPOSE_FILE=docker-compose.vultr.yml"
    ExecStartPre=/bin/sh -c 'if [ -f /opt/nzlegal/.fractional ]; then echo "COMPOSE_FILE=docker-compose.fractional.yml" > /run/nzlegal.env; else echo "COMPOSE_FILE=docker-compose.vultr.yml" > /run/nzlegal.env; fi'
    ExecStart=/bin/sh -c 'set -a; . /run/nzlegal.env; set +a; /usr/bin/docker compose -f ${COMPOSE_FILE} up -d --build'
    ExecStop=/bin/sh -c 'set -a; . /run/nzlegal.env; set +a; /usr/bin/docker compose -f ${COMPOSE_FILE} down'
    TimeoutStartSec=600

    [Install]
    WantedBy=multi-user.target
    EOF
  - systemctl daemon-reload
  - systemctl enable nzlegal.service

  # --- Add a message-of-the-day for the admin ---
  - |
    cat > /etc/update-motd.d/99-nzlegal << 'EOF'
    #!/bin/bash
    echo ""
    echo "  ⚖️  NZ Legal RAG Demo Server"
    echo "  ============================="
    echo "  App path:   /opt/nzlegal"
    echo "  Start:      sudo systemctl start nzlegal"
    echo "  Stop:       sudo systemctl stop nzlegal"
    echo "  Logs:       sudo docker logs -f nzlegal-api"
    echo "  Web UI:     http://$(hostname -I | awk '{print $1}')"
    echo ""
    EOF
  - chmod +x /etc/update-motd.d/99-nzlegal

  # --- Create a non-root user with passwordless sudo (optional but convenient) ---
  - useradd -m -s /bin/bash -G sudo nzlegal || true
  - echo "nzlegal ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/nzlegal

final_message: "Cloud-init finished. System ready for NZ Legal RAG deployment. Upload app files to /opt/nzlegal and run: sudo systemctl start nzlegal"
